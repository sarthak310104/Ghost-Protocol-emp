name: CI

# Catches broken builds here, in GitHub's own Actions tab, before
# they ever reach a real deploy on Render or Vercel -- every command
# below was individually verified to work exactly as written before
# this file was committed, not just assumed correct from the YAML.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run pytest suite
        run: pytest

  backend-imports-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ghost
          POSTGRES_PASSWORD: ghost
          POSTGRES_DB: ghost_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://ghost:ghost@localhost:5432/ghost_protocol
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate a throwaway Fernet key for this CI run
        # A real Fernet key is required for the app to construct its
        # crypto layer -- this one is generated fresh in-workflow, never
        # committed, and has no relationship to any real deployment's key.
        run: echo "GHOST_SECRET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Install full dependencies
        run: pip install -r requirements.txt
      - name: Confirm the app imports cleanly
        run: python -c "import app.main"
      - name: Run migrations against a real Postgres
        run: alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghost-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.example.com